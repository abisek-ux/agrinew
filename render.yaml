services:
  - type: web
    name: agrilink
    env: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: KEEP_ALIVE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: RESET_OTP_PEPPER
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "*"
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: agrinexus
      - key: GOOGLE_SCRIPT_URL
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_SECURE
        value: "true"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMS_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
