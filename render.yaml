services:
  - type: web
    name: agrilink
    env: node
    plan: free
    buildCommand: npm install && npm install --prefix client --include=dev && npm --prefix client run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: RESET_OTP_PEPPER
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "*"
      - key: MONGODB_URI
        sync: false
      - key: SMS_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
