<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2420"/>
      <stop offset="50%" stop-color="#071a1d"/>
      <stop offset="100%" stop-color="#041214"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8be28b"/>
      <stop offset="50%" stop-color="#37bd78"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#37bd78" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="240" r="130" fill="#37bd78" opacity="0.18" filter="url(#glow)"/>

  <!-- Sprout Stem & Leaves -->
  <g transform="translate(0, -10)">
    <!-- Main stem -->
    <path d="M 256 390 C 256 310, 240 240, 210 180 C 230 195, 248 220, 256 260 C 264 220, 282 195, 302 180 C 272 240, 256 310, 256 390 Z" fill="url(#leafGrad)"/>
    
    <!-- Left Leaf -->
    <path d="M 235 245 C 160 230, 110 160, 130 100 C 190 90, 245 150, 240 230 Z" fill="url(#leafGrad)"/>
    <path d="M 145 125 C 180 155, 210 195, 235 235" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Right Leaf -->
    <path d="M 277 245 C 352 230, 402 160, 382 100 C 322 90, 267 150, 272 230 Z" fill="url(#leafGrad)"/>
    <path d="M 367 125 C 332 155, 302 195, 277 235" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

    <!-- Sun/Harvest Accent -->
    <circle cx="256" cy="115" r="30" fill="url(#goldGrad)" filter="url(#glow)"/>
  </g>

  <!-- Soil / Foundation Curve -->
  <path d="M 120 400 Q 256 430 392 400" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85"/>
  <circle cx="256" cy="415" r="6" fill="#f59e0b"/>
</svg>
